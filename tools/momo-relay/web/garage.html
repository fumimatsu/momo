<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Momo FPV Garage</title>
  <style>
    :root { color-scheme: dark; --canvas: #080b0f; --surface: rgba(18, 25, 33, 0.88); --line: rgba(169, 196, 215, 0.2); --text: #f1f6fa; --muted: #99a9b7; --cyan: #53dbef; --green: #72e587; --amber: #ffc95c; --red: #ff6f70; }
    * { box-sizing: border-box; } body { min-width: 320px; min-height: 100vh; margin: 0; color: var(--text); background: radial-gradient(circle at 80% -15%, rgba(37, 133, 167, 0.22), transparent 38%), linear-gradient(145deg, #0b1016, var(--canvas) 62%); font-family: Inter, "Segoe UI", system-ui, sans-serif; }
    .shell { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0 56px; } .header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 27px; } .eyebrow { color: var(--cyan); font-size: 11px; font-weight: 800; letter-spacing: .17em; } h1 { margin: 5px 0 0; font-size: clamp(28px, 4vw, 42px); letter-spacing: -.04em; } .hint { max-width: 350px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; text-align: right; }
    .status { display: flex; align-items: center; gap: 8px; min-height: 24px; margin-bottom: 14px; color: var(--muted); font-size: 12px; } .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 12px currentColor; } .status.error .status-dot { background: var(--red); } .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(235px, 1fr)); gap: 14px; }
    .card { position: relative; display: grid; gap: 17px; min-height: 252px; padding: 19px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); box-shadow: 0 14px 34px rgba(0, 0, 0, .2); } .card::before { position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--muted); content: ""; } .card.ready::before { background: var(--green); } .card.connecting::before { background: var(--cyan); } .card.in_use::before { background: var(--amber); } .card.unavailable::before { background: var(--red); }
    .card-top { display: flex; align-items: start; justify-content: space-between; gap: 12px; } .car-id { color: var(--muted); font-size: 12px; font-weight: 750; letter-spacing: .1em; } .device { margin-top: 4px; font-size: 35px; font-weight: 800; letter-spacing: -.04em; line-height: 1; } .badge { border: 1px solid currentColor; border-radius: 999px; padding: 5px 8px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .08em; white-space: nowrap; } .ready .badge { color: var(--green); } .connecting .badge { color: var(--cyan); } .in_use .badge { color: var(--amber); } .unavailable .badge { color: var(--red); }
    .metrics { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); } .metric { padding: 11px 0; } .metric + .metric { border-left: 1px solid var(--line); padding-left: 13px; } .metric span { display: block; color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .08em; } .metric strong { display: block; margin-top: 4px; font-size: 17px; }
    .select { width: 100%; margin-top: auto; border: 1px solid rgba(83, 219, 239, .72); border-radius: 8px; padding: 11px 14px; background: rgba(27, 112, 132, .28); color: #ecfdff; cursor: pointer; font: inherit; font-size: 13px; font-weight: 800; letter-spacing: .04em; } .select:hover { background: rgba(33, 142, 165, .46); } .select:disabled { border-color: var(--line); background: rgba(100, 114, 124, .1); color: var(--muted); cursor: not-allowed; } .empty { grid-column: 1 / -1; padding: 34px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); text-align: center; }
    @media (max-width: 640px) { .shell { width: min(100% - 24px, 1120px); padding-top: 26px; } .header { align-items: start; flex-direction: column; } .hint { text-align: left; } }
  </style>
</head>
<body>
  <main class="shell"><header class="header"><div><div class="eyebrow">MOMO FPV / LOCAL RELAY</div><h1>CAR SELECT</h1></div><p class="hint">車両を選択すると、この PC で Pilot Viewer を開きます。使用中・映像未到着の車両は選択できません。</p></header><div id="status" class="status"><span class="status-dot"></span><span>RELAY に接続中</span></div><section id="cards" class="cards" aria-live="polite"></section></main>
  <script>
    (() => {
      const cards = document.getElementById('cards'); const status = document.getElementById('status'); let refreshInFlight = false;
      const labels = { ready: 'READY', connecting: 'CONNECTING', in_use: 'IN USE', unavailable: 'UNAVAILABLE' };
      function element(name, className, text) { const node = document.createElement(name); if (className) node.className = className; if (text !== undefined) node.textContent = text; return node; }
      function setStatus(text, isError) { status.classList.toggle('error', Boolean(isError)); status.lastElementChild.textContent = text; }
      function metric(label, value) { const root = element('div', 'metric'); root.append(element('span', '', label), element('strong', '', value)); return root; }
      function createCard(device) { const availability = String(device.availability || 'unavailable'); const root = element('article', `card ${availability}`); const top = element('div', 'card-top'); const title = element('div'); title.append(element('div', 'car-id', device.carId || 'CAR ID --'), element('div', 'device', device.device || '--')); top.append(title, element('span', 'badge', labels[availability] || 'UNAVAILABLE')); const fps = Number.isFinite(device.videoFps) ? `${device.videoFps.toFixed(1)} FPS` : '--'; const metrics = element('div', 'metrics'); metrics.append(metric('VIDEO', device.state || '--'), metric('RELAY FPS', fps)); const button = element('button', 'select', availability === 'ready' ? 'PILOT を開く' : labels[availability] || 'UNAVAILABLE'); button.type = 'button'; button.disabled = availability !== 'ready'; button.addEventListener('click', () => { const query = new URLSearchParams({ device: String(device.device || ''), carId: String(device.carId || '') }); const pilotUrl = new URL('pilot.html', window.location.href); pilotUrl.search = query; window.location.assign(pilotUrl); }); root.append(top, metrics, button); return root; }
      function render(snapshot) { const devices = Array.isArray(snapshot?.devices) ? snapshot.devices : []; cards.replaceChildren(); if (devices.length === 0) { cards.append(element('div', 'empty', '車両設定がありません。Relay の -source 設定を確認してください。')); return; } devices.forEach((device) => cards.append(createCard(device))); }
      async function refresh() { if (refreshInFlight) return; refreshInFlight = true; try { const response = await fetch('/api/v1/pilot-devices', { cache: 'no-store' }); if (!response.ok) throw new Error(`HTTP ${response.status}`); const snapshot = await response.json(); render(snapshot); setStatus(`RELAY 接続中 / ${new Date(snapshot.serverTime).toLocaleTimeString()}`, false); } catch (error) { setStatus(`Relay 状態を取得できません: ${error.message}`, true); } finally { refreshInFlight = false; } }
      refresh(); window.setInterval(refresh, 1000);
    })();
  </script>
</body>
</html>
