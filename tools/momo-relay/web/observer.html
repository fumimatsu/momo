<!doctype html>
<html lang="ja" data-mode="live">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050708">
  <title>Momo Team Observer</title>
  <link rel="stylesheet" href="observer.css?v=20260908-team-observer-v25">
  <script src="/telemetry.js?v=20260908-team-observer-v25"></script>
  <script src="../../race-ui-performance.js?v=20260908-team-observer-v25"></script>
  <script src="../../course-layout.js?v=20260908-team-observer-v25"></script>
  <script type="module" src="observer.js?v=20260908-team-observer-v25"></script>
</head>
<body>
  <div class="observer-app">
    <header class="race-header">
      <div class="header-title">
        <span class="live-dot" aria-hidden="true"></span>
        <div>
          <strong>TEAM OBSERVER</strong>
          <span id="trackName">SDK RACING / TOKOROZAWA BASE</span>
        </div>
      </div>
      <div class="header-metric live-state">
        <span>STATUS</span>
        <strong id="liveStatus">WAITING</strong>
      </div>
      <div class="header-metric">
        <span>HEAT</span>
        <strong id="heatValue">--</strong>
      </div>
      <div class="header-clock" aria-label="Race time">
        <span id="raceClockLabel">RACE TIME</span>
        <strong id="raceClock">--:--.---</strong>
      </div>
      <div class="header-metric lap-metric">
        <span>LAP</span>
        <strong id="lapValue">-- <em>/ --</em></strong>
      </div>
    </header>

    <section class="team-monitor" aria-labelledby="teamMonitorTitle">
      <div class="team-selection-bar">
        <div class="team-selection-title">
          <span class="eyebrow">FIXED DETAIL MONITOR</span>
          <h2 id="teamMonitorTitle">TEAM CARS</h2>
        </div>
        <div id="teamSelectionSlots" class="team-selection-slots" aria-label="Selected team cars"></div>
        <button id="teamSelectorOpen" class="team-selector-open" type="button" aria-haspopup="dialog" aria-controls="teamSelectorDrawer">
          MANAGE
        </button>
      </div>
      <div id="fleetDataStatus" class="fleet-data-status" aria-label="Fleet data freshness">
        <span id="fleet-directory-status"></span>
        <span id="fleet-devices-status"></span>
      </div>
      <section id="cameraGrid" class="camera-grid" aria-label="Selected onboard camera previews"></section>
    </section>

    <div id="observerRacePanels" style="display:contents"></div>

  </div>

  <div id="observerSelectionDrawer"></div>
</body>
</html>
